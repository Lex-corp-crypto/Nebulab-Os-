global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  # Scraping Master Core API
  - job_name: 'nebulalab-core-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:8000', 'localhost:8000']
        labels:
          role: 'master'
          cluster: 'nebulalab'

  # Scraping Prometheus lui-même
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
