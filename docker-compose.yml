version: '3.8'

services:
  # Master API & Central Orchestrator
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: nebulalab_api
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/distributed_lab
      - SECRET_KEY=${SECRET_KEY:-nebulalab-super-secret-cluster-key-2026}
      - API_PORT=8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TUNNEL_PROVIDER=${TUNNEL_PROVIDER:-auto}
      - TUNNEL_ENABLED=${TUNNEL_ENABLED:-true}
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:-}
    ports:
      - "8000:8000"
      - "5354:5354/udp"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    networks:
      - nebulalab_net

  # Agent Local pour le nœud Master
  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: nebulalab_agent_local
    restart: unless-stopped
    environment:
      - HOSTNAME=master-node
      - API_URL=http://api:8000
      - METRICS_INTERVAL=5
      - HEARTBEAT_INTERVAL=10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
    depends_on:
      - api
    networks:
      - nebulalab_net

  # Base de données PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: nebulalab_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=distributed_lab
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d distributed_lab"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nebulalab_net

  # Redis Cache & PubSub
  redis:
    image: redis:7-alpine
    container_name: nebulalab_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nebulalab_net

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: nebulalab_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - nebulalab_net

volumes:
  postgres_data:
  redis_data:
  prometheus_data:

networks:
  nebulalab_net:
    driver: bridge
